<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Read">
<meta name="theme-color" content="#ffffff">
<title>Daily Read</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#eeecea;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --border:#e0dedd;--accent:#2563eb;--accent-bg:#eff6ff;--accent-text:#1d4ed8;
  --green:#16a34a;--green-bg:#f0fdf4;--green-text:#15803d;
  --done-bg:#fef9c3;--done-text:#854d0e;
  --radius:14px;--radius-sm:8px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;--border:#3a3a3c;--accent:#60a5fa;--accent-bg:#1e3a5f;--accent-text:#93c5fd;--green:#4ade80;--green-bg:#14532d;--green-text:#86efac;--done-bg:#422006;--done-text:#fcd34d;}
}
html,body{height:100%;height:-webkit-fill-available;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;font-size:16px;line-height:1.6;}
#app{max-width:430px;margin:0 auto;height:100%;height:-webkit-fill-available;display:flex;flex-direction:column;}
header{padding:max(16px,env(safe-area-inset-top)) 20px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.logo{font-size:18px;font-weight:600;letter-spacing:-0.3px;}.logo span{color:var(--accent);}
.streak{font-size:12px;color:var(--text3);background:var(--bg2);padding:4px 10px;border-radius:20px;}
.level-bar{display:flex;gap:8px;padding:14px 20px 0;flex-shrink:0;}
.lv-btn{flex:1;padding:7px 0;border:1px solid var(--border);background:var(--bg);color:var(--text2);border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;}
.lv-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.card{margin:16px 20px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:20px;}
.card-meta{font-size:11px;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.hanamaru{font-size:18px;display:none;}.hanamaru.show{display:inline;}
.card-tags{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tag-level{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--green-bg);color:var(--green-text);}
.tag-topic{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--accent-bg);color:var(--accent-text);}
.tag-done{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--done-bg);color:var(--done-text);display:none;}
.tag-done.show{display:inline;}
.word-count{font-size:11px;color:var(--text3);}
.card h2{font-size:19px;font-weight:600;line-height:1.35;margin-bottom:16px;letter-spacing:-0.2px;}
.body-text{font-size:15px;line-height:1.95;color:var(--text);margin-bottom:12px;}
.divider{border:none;border-top:0.5px solid var(--border);margin:16px 0;}
.insight-box{background:var(--bg2);border-left:3px solid var(--accent);padding:12px 14px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:16px;}
.insight-label{font-size:10px;font-weight:600;color:var(--accent-text);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.insight-text{font-size:13px;line-height:1.65;color:var(--text);}
.vocab-title{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:10px;letter-spacing:.04em;text-transform:uppercase;}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.vocab-item{background:var(--bg2);border-radius:var(--radius-sm);padding:8px 12px;}
.vocab-word{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px;}
.vocab-jp{font-size:11px;color:var(--text2);}
#init-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;color:var(--text3);}
.spinner{width:32px;height:32px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{font-size:14px;}
.bottom-bar{padding:12px 20px;padding-bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);border-top:0.5px solid var(--border);flex-shrink:0;}
.btn-next{flex:1;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:13px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;}
.btn-next:active{opacity:.8;}
.btn-done{flex:1;background:var(--done-bg);color:var(--done-text);border:none;border-radius:var(--radius-sm);padding:13px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;}
.btn-done.completed{opacity:.5;cursor:default;}
.btn-icon{background:var(--bg2);color:var(--text2);border:none;border-radius:var(--radius-sm);padding:13px 15px;font-size:17px;cursor:pointer;}
#celebrate{position:fixed;inset:0;pointer-events:none;z-index:99;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;}
#celebrate.show{opacity:1;}
.celebrate-inner{font-size:80px;animation:pop .4s cubic-bezier(.36,1.6,.48,1) forwards;}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0deg)}}
.panel{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease;}
.panel.open{transform:translateY(0);}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:0.5px solid var(--border);}
.panel-title{font-size:17px;font-weight:600;}
.btn-close{background:var(--bg2);border:none;border-radius:20px;padding:6px 14px;font-size:14px;color:var(--text2);cursor:pointer;}
.panel-body{overflow-y:auto;flex:1;padding:16px 20px;}
.history-item{padding:14px 0;border-bottom:0.5px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px;}
.history-item:last-child{border-bottom:none;}
.h-hana{font-size:16px;min-width:20px;}
.h-info .h-title{font-size:14px;font-weight:500;margin-bottom:3px;}
.h-info .h-meta{font-size:12px;color:var(--text3);}
.empty-state{text-align:center;color:var(--text3);font-size:14px;margin-top:60px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav button{background:var(--bg2);border:none;border-radius:var(--radius-sm);padding:6px 14px;font-size:16px;color:var(--text);cursor:pointer;}
.cal-month{font-size:16px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:11px;color:var(--text3);padding:4px 0;font-weight:500;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;color:var(--text2);}
.cal-day.read{background:var(--accent);color:#fff;font-weight:500;cursor:pointer;}
.cal-day.read-partial{background:var(--bg3);cursor:pointer;}
.cal-day.today{border:1.5px solid var(--accent);color:var(--accent);font-weight:500;}
.cal-day.today.read{border:none;}.cal-day.empty{opacity:0;}
.cal-legend{display:flex;align-items:center;gap:16px;margin-top:14px;font-size:12px;color:var(--text3);}
.leg-item{display:flex;align-items:center;gap:6px;}
.leg-dot{width:10px;height:10px;border-radius:50%;}
.cal-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px;}
.stat-card{background:var(--bg2);border-radius:var(--radius-sm);padding:12px;text-align:center;}
.stat-num{font-size:22px;font-weight:600;color:var(--accent);}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px;}
.stat-wide{grid-column:1/-1;}
.save-status{font-size:10px;color:var(--text3);text-align:center;padding:2px 0;flex-shrink:0;min-height:18px;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Daily<span>Read</span></div>
    <div class="streak" id="streak-badge">🔥 0日連続</div>
  </header>
  <div class="level-bar">
    <button class="lv-btn active" data-lv="A1" onclick="setLevel('A1')">A1</button>
    <button class="lv-btn" data-lv="A2" onclick="setLevel('A2')">A2</button>
    <button class="lv-btn" data-lv="B1" onclick="setLevel('B1')">B1</button>
  </div>
  <div id="init-loading"><div class="spinner"></div><div class="loading-msg">読み込み中...</div></div>
  <div id="article-view" class="hidden" style="flex:1;overflow-y:auto;">
    <div class="card">
      <div class="card-meta"><span id="card-date"></span><span class="hanamaru" id="hanamaru">🌸</span></div>
      <div class="card-tags">
        <span class="tag-level" id="tag-level"></span>
        <span class="tag-topic" id="tag-topic"></span>
        <span class="tag-done" id="tag-done">✅ 読了</span>
        <span class="word-count" id="word-count"></span>
      </div>
      <h2 id="article-title"></h2>
      <p class="body-text" id="article-p1"></p>
      <p class="body-text" id="article-p2"></p>
      <hr class="divider">
      <div class="insight-box">
        <div class="insight-label">One New Insight</div>
        <div class="insight-text" id="article-insight"></div>
      </div>
      <hr class="divider">
      <div class="vocab-title">Key Vocabulary</div>
      <div class="vocab-grid" id="vocab-grid"></div>
    </div>
  </div>
  <div class="save-status" id="save-status"></div>
  <div class="bottom-bar">
    <button class="btn-icon" onclick="toggleCalendar()">📅</button>
    <button class="btn-icon" onclick="toggleHistory()">📚</button>
    <button class="btn-done" id="btn-done" onclick="markDone()">🌸 読了！</button>
    <button class="btn-next" onclick="nextArticle()">✨ 次の記事</button>
  </div>
</div>
<div id="celebrate"><div class="celebrate-inner">🌸</div></div>
<div id="cal-panel" class="panel">
  <div class="panel-header">
    <div class="panel-title">📅 読んだ日</div>
    <button class="btn-close" onclick="toggleCalendar()">閉じる</button>
  </div>
  <div class="panel-body">
    <div class="cal-nav">
      <button onclick="calMove(-1)">‹</button>
      <div class="cal-month" id="cal-month"></div>
      <button onclick="calMove(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--accent)"></div><span>読了した日</span></div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--bg3);border:1px solid var(--border)"></div><span>記事を開いた日</span></div>
    </div>
    <div class="cal-stats" id="cal-stats"></div>
  </div>
</div>
<div id="hist-panel" class="panel">
  <div class="panel-header">
    <div class="panel-title">📚 読んだ記事</div>
    <button class="btn-close" onclick="toggleHistory()">閉じる</button>
  </div>
  <div class="panel-body" id="history-list"></div>
</div>

<script src="articles.js"></script>
<script>
const PROJECT_ID='graded-reading-51be9';
const API_KEY='AIzaSyDVWGqyhlssB1C6EHPcQfRKGZA4h9YuxhA';
const FS_BASE=`https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/users`;
const DOW=['日','月','火','水','木','金','土'];

let state={level:'A1',history:[],currentArticle:null,streak:0,lastReadDate:null,readDates:[],openedDates:[],totalWords:0,shownIds:[]};
let calYear,calMonth;

function getUserId(){
  let uid=localStorage.getItem('dr-uid');
  if(!uid){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('dr-uid',uid);}
  return uid;
}
const UID=getUserId();

function toFS(obj){
  function cv(v){
    if(v===null||v===undefined)return{nullValue:null};
    if(typeof v==='boolean')return{booleanValue:v};
    if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
    if(typeof v==='string')return{stringValue:v};
    if(Array.isArray(v))return{arrayValue:{values:v.map(cv)}};
    if(typeof v==='object')return{mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,val])=>[k,cv(val)]))}};
    return{stringValue:String(v)};
  }
  return{fields:Object.fromEntries(Object.entries(obj).map(([k,v])=>[k,cv(v)]))};
}
function fromFS(fields){
  function pv(v){
    if('nullValue'in v)return null;
    if('booleanValue'in v)return v.booleanValue;
    if('integerValue'in v)return parseInt(v.integerValue);
    if('doubleValue'in v)return v.doubleValue;
    if('stringValue'in v)return v.stringValue;
    if('arrayValue'in v)return(v.arrayValue.values||[]).map(pv);
    if('mapValue'in v)return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,val])=>[k,pv(val)]));
    return null;
  }
  return Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,pv(v)]));
}
async function fsGet(){
  const r=await fetch(`${FS_BASE}/${UID}`);
  if(r.status===404)return null;
  if(!r.ok)throw new Error('GET failed');
  const d=await r.json();
  return fromFS(d.fields||{});
}
async function fsSave(){
  const r=await fetch(`${FS_BASE}/${UID}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(toFS(state))});
  if(!r.ok)throw new Error('PATCH failed');
}

async function init(){
  try{
    const data=await fsGet();
    if(data)state={...state,...data};
    setSaveStatus('✅ 読み込み完了');
  }catch(e){
    const bk=localStorage.getItem('dr-bk');
    if(bk)state={...state,...JSON.parse(bk)};
    setSaveStatus('⚠️ オフライン');
  }
  updateLevelButtons();updateStreakBadge();
  if(state.currentArticle)showArticle(state.currentArticle);
  else nextArticle();
}
async function saveState(){
  localStorage.setItem('dr-bk',JSON.stringify(state));
  try{await fsSave();setSaveStatus('✅ 保存済み');}
  catch(e){setSaveStatus('⚠️ ローカル保存');}
}
function setSaveStatus(msg){
  const el=document.getElementById('save-status');
  el.textContent=msg;
  setTimeout(()=>{el.textContent='';},3000);
}

function nextArticle(){
  const pool=ARTICLES[state.level];
  if(!state.shownIds)state.shownIds=[];
  const shown=state.shownIds.filter(id=>id.startsWith(state.level+'_'));
  let unseen=pool.map((a,i)=>({...a,id:`${state.level}_${i}`})).filter(a=>!shown.includes(a.id));
  if(!unseen.length){
    state.shownIds=state.shownIds.filter(id=>!id.startsWith(state.level+'_'));
    unseen=pool.map((a,i)=>({...a,id:`${state.level}_${i}`}));
  }
  const article=unseen[Math.floor(Math.random()*unseen.length)];
  state.shownIds.push(article.id);
  const iso=todayISO();
  if(!state.openedDates)state.openedDates=[];
  if(!state.openedDates.includes(iso))state.openedDates.push(iso);
  const wc=[article.title,article.p1,article.p2,article.insight].join(' ').split(/\s+/).filter(Boolean).length;
  const full={...article,wordCount:wc,date:todayLabel(),iso,done:false};
  state.currentArticle=full;
  state.history.unshift(full);
  if(state.history.length>100)state.history.pop();
  saveState();
  showArticle(full);
}

function showArticle(a){
  document.getElementById('card-date').textContent=a.date||'';
  document.getElementById('tag-level').textContent=a.level;
  document.getElementById('tag-topic').textContent=a.topic;
  document.getElementById('word-count').textContent=`${a.wordCount} words`;
  document.getElementById('article-title').textContent=a.title;
  document.getElementById('article-p1').textContent=a.p1;
  document.getElementById('article-p2').textContent=a.p2;
  document.getElementById('article-insight').textContent=a.insight;
  const grid=document.getElementById('vocab-grid');
  grid.innerHTML=(a.vocab||[]).map(v=>`<div class="vocab-item"><div class="vocab-word">${v.word}</div><div class="vocab-jp">${v.jp}</div></div>`).join('');
  setDoneUI(a.done);
  document.getElementById('init-loading').classList.add('hidden');
  document.getElementById('article-view').classList.remove('hidden');
  document.getElementById('btn-done').disabled=!!a.done;
}
function setDoneUI(done){
  document.getElementById('hanamaru').classList.toggle('show',!!done);
  document.getElementById('tag-done').classList.toggle('show',!!done);
  const btn=document.getElementById('btn-done');
  btn.classList.toggle('completed',!!done);
  btn.textContent=done?'🌸 読了済み':'🌸 読了！';
  btn.disabled=!!done;
}
async function markDone(){
  const a=state.currentArticle;
  if(!a||a.done)return;
  a.done=true;
  const iso=todayISO();
  const yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(!state.readDates)state.readDates=[];
  if(!state.readDates.includes(iso)){
    state.readDates.push(iso);
    state.streak=(state.lastReadDate===yest)?(state.streak||0)+1:1;
    state.lastReadDate=iso;
  }
  state.totalWords=(state.totalWords||0)+a.wordCount;
  const hi=state.history.findIndex(h=>h.title===a.title&&h.date===a.date);
  if(hi>=0)state.history[hi].done=true;
  await saveState();
  setDoneUI(true);
  showCelebration();
  updateStreakBadge();
}
function showCelebration(){
  const el=document.getElementById('celebrate');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1200);
}

function todayISO(){return new Date().toISOString().slice(0,10);}
function todayLabel(){return new Date().toLocaleDateString('ja-JP');}
function updateStreakBadge(){document.getElementById('streak-badge').textContent=`🔥 ${state.streak||0}日連続`;}
function setLevel(lv){state.level=lv;updateLevelButtons();saveState();}
function updateLevelButtons(){document.querySelectorAll('.lv-btn').forEach(b=>b.classList.toggle('active',b.dataset.lv===state.level));}

function toggleCalendar(){
  const p=document.getElementById('cal-panel');
  p.classList.toggle('open');
  if(p.classList.contains('open')){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();renderCalendar();}
}
function calMove(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}
function renderCalendar(){
  const readSet=new Set(state.readDates||[]);
  const openSet=new Set(state.openedDates||[]);
  const today=todayISO();
  document.getElementById('cal-month').textContent=`${calYear}年${calMonth+1}月`;
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  let html=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=days;d++){
    const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isRead=readSet.has(iso),isOpen=openSet.has(iso),isToday=iso===today;
    let cls='cal-day';
    if(isRead)cls+=' read';else if(isOpen)cls+=' read-partial';else if(isToday)cls+=' today';
    const oc=(isRead||isOpen)?`onclick="showDayArticle('${iso}')"`:'' ;
    html+=`<div class="${cls}" ${oc}>${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
  const total=(state.readDates||[]).length;
  const mo=String(calMonth+1).padStart(2,'0');
  const thisMonth=(state.readDates||[]).filter(d=>d.startsWith(`${calYear}-${mo}`)).length;
  document.getElementById('cal-stats').innerHTML=`
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">読了日数</div></div>
    <div class="stat-card"><div class="stat-num">${thisMonth}</div><div class="stat-label">今月</div></div>
    <div class="stat-card"><div class="stat-num">${state.streak||0}</div><div class="stat-label">🔥 連続</div></div>
    <div class="stat-card stat-wide"><div class="stat-num">${(state.totalWords||0).toLocaleString()}</div><div class="stat-label">📖 累計語彙数</div></div>`;
}
function showDayArticle(iso){
  const lbl=new Date(iso+'T00:00:00').toLocaleDateString('ja-JP');
  const found=state.history.find(a=>a.iso===iso||a.date===lbl);
  if(found){state.currentArticle=found;showArticle(found);}
  toggleCalendar();
}

function toggleHistory(){
  const p=document.getElementById('hist-panel');
  p.classList.toggle('open');
  if(p.classList.contains('open'))renderHistory();
}
function renderHistory(){
  const list=document.getElementById('history-list');
  if(!state.history.length){list.innerHTML='<div class="empty-state">まだ記事がありません</div>';return;}
  list.innerHTML=state.history.map((a,i)=>`
    <div class="history-item" onclick="loadFromHistory(${i})">
      <div class="h-hana">${a.done?'🌸':'　'}</div>
      <div class="h-info"><div class="h-title">${a.title}</div><div class="h-meta">${a.date} · ${a.topic} · ${a.level} · ${a.wordCount} words</div></div>
    </div>`).join('');
}
function loadFromHistory(i){state.currentArticle=state.history[i];showArticle(state.currentArticle);toggleHistory();}

init();
</script>
</body>
</html>
